name: docshelf
description: An offline reader for documents, spreadsheets and slides.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  csv: ^6.0.0
  file_picker: ^10.3.10
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  pdfrx: ^3.0.2
  two_dimensional_scrollables: ^0.5.6
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/docshelf.png
